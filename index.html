<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RiseUp AI | Created by Jahnavi</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f6f3ff;
      color: #29213c;
      text-align: center;
    }
    header {
      background: #482a82;
      color: white;
      padding: 28px 16px;
    }
    header h1 { margin: 0; font-size: 32px; }
    header p { margin-bottom: 0; }
    main { padding: 30px 18px; }
    .card {
      max-width: 520px;
      margin: 0 auto;
      padding: 25px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 5px 20px #d9d0ee;
    }
    button {
      background: #6c4cbe;
      color: white;
      border: 0;
      border-radius: 12px;
      padding: 13px 20px;
      font-size: 16px;
      margin: 6px;
      cursor: pointer;
    }
    footer { padding: 25px; color: #6b627a; }
  </style>
</head>
<body>
  <header>
    <h1>💜 RiseUp AI</h1>
    <p>Your AI companion for a better tomorrow</p>
  </header>
  <main>
    <div class="card">
      <h2>Dream Big. Rise Higher.</h2>
      <p>Your journey towards learning, creativity and innovation starts here.</p>
      <button onclick="alert('Welcome to RiseUp AI!')">Get Started</button>
      <button onclick="alert('More features coming soon!')">Explore Features</button>
    </div>
  </main>
  <footer>Created with 💜 by Jahnavi</footer>
</body>
</html>
